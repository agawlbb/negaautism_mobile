name: iOS build and TestFlight
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload signed build to TestFlight
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      PUBLISH: ${{ inputs.publish }}
      FIREBASE_IOS_PLIST_BASE64: ${{ secrets.FIREBASE_IOS_PLIST_BASE64 }}
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release configuration
        run: python3 scripts/ios_release.py preflight
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer
          xcodebuild -version
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: python3 -m unittest discover -s scripts -p test_ios_release.py
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --concurrency=1
      - name: Configure Firebase and signing
        run: python3 scripts/ios_release.py configure
      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug --no-codesign
      - name: Verify iOS startup on simulator
        run: python3 scripts/ios_launch_smoke.py
      - name: Save launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-launch-smoke
          path: build/ios/launch-smoke/launch.png
          if-no-files-found: ignore
      - name: Build unsigned iOS app
        if: ${{ !inputs.publish }}
        run: flutter build ios --release --no-codesign --build-number "$GITHUB_RUN_NUMBER"
      - name: Build signed archive
        if: ${{ inputs.publish }}
        run: flutter build ipa --release --build-number "$GITHUB_RUN_NUMBER" --export-options-plist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Verify exported distribution package
        if: ${{ inputs.publish }}
        run: python3 scripts/verify_ios_ipa.py
      - name: Upload to App Store Connect
        if: ${{ inputs.publish }}
        run: >-
          xcrun altool --upload-app --type ios
          --file "$(find build/ios/ipa -name '*.ipa' -print -quit)"
          --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove signing material
        if: always()
        run: python3 scripts/ios_release.py cleanup
