name: iOS build and TestFlight
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload signed build to TestFlight
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PUBLISH: ${{ inputs.publish }}
      FIREBASE_IOS_PLIST_BASE64: ${{ secrets.FIREBASE_IOS_PLIST_BASE64 }}
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release configuration
        run: python3 scripts/ios_release.py preflight
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --concurrency=1
      - name: Configure Firebase and signing
        run: python3 scripts/ios_release.py configure
      - name: Build unsigned iOS app
        if: ${{ !inputs.publish }}
        run: flutter build ios --release --no-codesign --build-number "$(date -u +%y%m%d%H%M)"
      - name: Build signed archive
        if: ${{ inputs.publish }}
        run: flutter build ipa --release --build-number "$(date -u +%y%m%d%H%M)" --export-options-plist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload to App Store Connect
        if: ${{ inputs.publish }}
        run: >-
          xcrun altool --upload-app --type ios
          --file "$(find build/ios/ipa -name '*.ipa' -print -quit)"
          --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove signing material
        if: always()
        run: python3 scripts/ios_release.py cleanup
